CONFIG_STM32_MEMMAP=y

# Boot splash on the DK panel (zero-copy LTDC pointed at the same
# AXISRAM3..6 scan buffer the application uses; see stm32n6_splash.c)
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC_ARGB8888=y
CONFIG_STM32_LTDC_FB_NUM=0

# Synchronous logging: with deferred mode an init-time hang swallows ALL
# buffered logs (observed while bringing up the splash) — minimal mode
# prints immediately, so a hang shows exactly how far init got.
CONFIG_LOG_MODE_MINIMAL=y

# CONFIG_DISPLAY drags in the XSPI-PSRAM memory controller through the
# LTDC node's ext-sdram phandle — at init priority 0, in the raw
# post-BootROM state, its init wedges the bus before the console even
# exists (observed: total UART silence + debugger AP errors). The FSBL
# never touches PSRAM; keep the controller out.
CONFIG_MEMC=n

# Serial recovery over the N6's own USB OTG HS controller (CN18, native
# CDC-ACM device): firmware updates with no boot-switch changes; the
# data path never touches the ST-Link chip. Both cables must be
# connected: ST-Link (CN6) powers the board, USB-C (CN18) carries the
# update. Entry: USER button held during reset (mcuboot-button0 alias),
# or the app's software request (TAMP magic: on-screen DFU button /
# "dfu" line on the app's own CN18 CDC-ACM console — see
# usb_dfu_trigger.c in the app).
#
# WAIT_FOR_DFU (the old third entry path: any SMP traffic within 350 ms
# after reset) is deliberately OFF: it brought USB up as the recovery
# device (PID 0x0100) on EVERY boot and dropped it after 350 ms — less
# than Windows' enumeration time — leaving a dead "device not
# functioning" node that then blocked the app's own CDC (PID 0x0101)
# from enumerating until the CN18 cable was physically replugged
# (root-caused 2026-07-06). Button + TAMP entry make it redundant; it
# was also flash_cli.py's "catch a reset press" fallback, which now
# requires button/software entry instead.
#
# HISTORY (do not re-litigate): the first CDC attempts "hung" pre-console
# with a black screen. Root cause was NOT USB: the FSBL had outgrown the
# 64 KB boot_partition, the slot-0 download overwrote its tail, and the
# BootROM rejected the corrupted signature and fell back to its own USB
# DFU loader. Fixed by the 128 KB boot partition in the board DTS plus
# the build-time size guard (check_fsbl_size.cmake), both in the zephyr
# fork. app.overlay redirects mcumgr to CDC-ACM, so the UART console and
# FSBL boot logs stay ON.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=n
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_USB_DEVICE_PRODUCT="BikePC DFU"
CONFIG_USB_DEVICE_MANUFACTURER="SetZero"

# Upload throughput: allow 8 KB SMP requests (default 1 KB forces tiny
# chunks, each a USB round-trip).
#
# DO NOT enable CONFIG_BOOT_ERASE_PROGRESSIVELY on this board: it erases
# 4 KB sectors between writes, but the MX66UW in octal-DTR wipes a larger
# region than the driver's page layout claims — every mid-upload erase
# destroyed previously written data. Observed 2026-07-04 as two distinct
# corruptions (8 KB chunks: header gone, "image not found"; 1 KB chunks:
# header OK, body SHA mismatch → slot scrambled). The upfront whole-slot
# erase (a few seconds) is the reliable path.
CONFIG_BOOT_LINE_BUFS=64
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=8192

# Blank the panel during serial recovery (LTDC underrun flicker during
# flash writes) - see mcuboot_status_change() in stm32n6_splash.c.
CONFIG_MCUBOOT_ACTION_HOOKS=y

# Exit DFU mode with the USER button (sw0/PC13): sys_reboot() on
# press-and-release, polled in stm32n6_splash.c.
#
# DO NOT enable CONFIG_I2C / CONFIG_INPUT / CONFIG_INPUT_GT911 here for an
# on-screen exit button: the GT911 init dance (PE1 module reset + PQ4 INT
# strap, every FSBL boot) puts the LCD panel's driver IC into a dead state
# that survives the app's full LTDC re-init — white screen everywhere
# until an FSBL without it is flashed (root-caused 2026-07-05; the SoC
# side measures perfect while the glass shows garbage).
CONFIG_REBOOT=y
# Zephyr's default sample VID/PID (0x2FE3/0x100) - fine for a private
# board, not for redistribution; get a real PID from usb.org for that.

CONFIG_MULTIPLE_EXECUTABLE_RAM_REGIONS=y
# Use RAM load mode instead of swap
CONFIG_BOOT_RAM_LOAD=y
CONFIG_BOOT_PREFER_SWAP_OFFSET=n